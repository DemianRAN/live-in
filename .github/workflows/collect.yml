name: Collect live events

# 収集 → data/ をコミット → サイト生成 → Pages へデプロイ を1本で行う。
# GITHUB_TOKEN でのプッシュは他のワークフロー（pages.yml の on: push）を
# 起動しないため、デプロイもこのワークフロー内で済ませる。
# web/ は生成物なのでリポジトリにはコミットしない（Pages の artifact のみ）。

on:
  schedule:
    # 07:00 JST（UTC 22:00）と 19:00 JST（UTC 10:00）の1日2回
    - cron: "0 22 * * *"
    - cron: "0 10 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

# 収集の多重実行を防ぐ（手動実行と定時実行が重なった場合など）
concurrency:
  group: collect
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    outputs:
      alert_fail: ${{ steps.alerts.outputs.alert_fail }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Collect
        run: python3 collector/collect.py
      - name: Commit data
        run: |
          git config user.name "live-bot"
          git config user.email "live-bot@users.noreply.github.com"
          git add data
          if git diff --cached --quiet; then
            echo "no data changes"
            exit 0
          fi
          git commit -m "auto: update events"
          # 収集中（約16分）に main へ手動プッシュがあっても失敗しないよう
          # 最新を取り込んでからプッシュする（data/ はボット専用なので
          # 通常は衝突しない）
          for i in 1 2 3; do
            git pull --rebase origin main && git push origin HEAD:main && exit 0
            sleep 5
          done
          echo "push failed after retries" >&2
          exit 1
      - name: Build site
        run: python3 collector/build.py
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web
      # アラートの判定だけ行い、ここではジョブを失敗させない
      # （失敗させるとデプロイが走らなくなるため）。最後の alerts ジョブで落とす。
      - name: Check collection alerts
        id: alerts
        if: always()
        run: |
          python3 - << 'PY'
          import json, os
          fail = False
          try:
              state = json.load(open("data/state.json"))
          except Exception as e:
              print(f"state.json unreadable: {e}")
              state = {}
          alerts = state.get("alerts", [])
          threshold = state.get("alert_fail_streak", 2)
          if not alerts:
              print("alerts: none")
          else:
              print(f"=== COLLECTION ALERTS: {len(alerts)} "
                    f"(job fails when streak >= {threshold}) ===")
              for a in alerts:
                  streak = a.get("streak", 1)
                  if streak >= threshold:
                      fail = True
                  print(f"[{a.get('kind')}] {a.get('venue_name')} ({a.get('venue')}): "
                        f"prev={a.get('prev')} new={a.get('new')} streak={streak} "
                        f"carried={a.get('carried', 0)} - {a.get('message')}")
          with open(os.environ["GITHUB_OUTPUT"], "a") as f:
              f.write(f"alert_fail={'true' if fail else 'false'}\n")
          PY

  deploy:
    needs: collect
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    concurrency:
      group: pages
      cancel-in-progress: false
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

  # 同じ会場のアラートが連続した場合だけジョブを失敗させ、
  # GitHub の失敗通知でオーナーに知らせる（一過性の失敗では通知しない）。
  alerts:
    needs: [collect, deploy]
    if: always() && needs.collect.outputs.alert_fail == 'true'
    runs-on: ubuntu-latest
    steps:
      - run: |
          echo "Collection alerts persisted for consecutive runs. See the 'Check collection alerts' step of the collect job."
          exit 1
