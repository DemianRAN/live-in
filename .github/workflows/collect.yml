name: Collect live events

on:
  schedule:
    # 07:00 JST（UTC 22:00）
    - cron: "0 22 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Collect
        run: python3 collector/collect.py
      - name: Build site
        run: python3 collector/build.py
      - name: Commit updates
        run: |
          git config user.name "live-bot"
          git config user.email "live-bot@users.noreply.github.com"
          git add data web
          git diff --cached --quiet || git commit -m "auto: update events"
          git push
